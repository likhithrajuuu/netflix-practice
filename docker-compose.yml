services:

  # ============================================================
  # DATABASE
  # ============================================================

  postgres:
    image: postgres:16-alpine
    container_name: netflix-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: content_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_db"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ============================================================
  # REDIS
  # ============================================================

  redis:
    image: redis:7-alpine
    container_name: netflix-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # ============================================================
  # ZOOKEEPER
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: netflix-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"


  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: netflix-kafka
    restart: unless-stopped

    depends_on:
      zookeeper:
        condition: service_started

    ports:
      - "9092:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics --bootstrap-server localhost:9092 --list"
        ]
      interval: 10s
      timeout: 10s
      retries: 10


  # ============================================================
  # LOCAL S3
  # ============================================================

  localstack:
    image: localstack/localstack:latest
    container_name: netflix-localstack
    restart: unless-stopped

    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ap-south-1
      DEBUG: "0"

    ports:
      - "4566:4566"

    volumes:
      - localstack_data:/var/lib/localstack
      - "/var/run/docker.sock:/var/run/docker.sock"


  # ============================================================
  # CONTENT SERVICE
  # ============================================================

  content-service:
    build:
      context: ./content-service
      dockerfile: Dockerfile

    container_name: netflix-content-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8081:8080"

    environment:

      DB_URL: jdbc:postgresql://postgres:5432/content_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SPRING_PROFILES_ACTIVE: docker

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

        reservations:
          cpus: "0.5"
          memory: 512M


  # ============================================================
  # VIDEO SERVICE
  # ============================================================

  video-service:
    build:
      context: ./video-service
      dockerfile: Dockerfile

    container_name: netflix-video-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy

      localstack:
        condition: service_started

    ports:
      - "8082:8080"

    environment:

      DB_URL: jdbc:postgresql://postgres:5432/content_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-south-1

      AWS_ENDPOINT_URL: http://localstack:4566

      AWS_S3_BUCKET: netflix-videos

      SPRING_PROFILES_ACTIVE: docker

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

        reservations:
          cpus: "0.5"
          memory: 512M


  # ============================================================
  # STREAMING SERVICE
  # ============================================================

  streaming-service:
    build:
      context: ./streaming-service
      dockerfile: Dockerfile

    container_name: netflix-streaming-service

    restart: unless-stopped

    depends_on:

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

      localstack:
        condition: service_started

    ports:
      - "8084:8080"

    environment:

      REDIS_HOST: redis
      REDIS_PORT: 6379

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-south-1

      AWS_ENDPOINT_URL: http://localstack:4566

      AWS_S3_BUCKET: netflix-videos

      SPRING_PROFILES_ACTIVE: docker

    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

        reservations:
          cpus: "0.5"
          memory: 512M


  # ============================================================
  # ENCODING SERVICE
  # ============================================================

  encoding-service:
    build:
      context: ./encoding-service
      dockerfile: Dockerfile

    container_name: netflix-encoding-service

    restart: unless-stopped

    depends_on:

      kafka:
        condition: service_healthy

      localstack:
        condition: service_started

    environment:

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-south-1

      AWS_ENDPOINT_URL: http://localstack:4566

      AWS_S3_BUCKET: netflix-videos

      FFMPEG_PATH: /usr/bin/ffmpeg

      SPRING_PROFILES_ACTIVE: docker

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

        reservations:
          cpus: "1.0"
          memory: 1G


# ================================================================
# VOLUMES
# ================================================================

volumes:

  postgres_data:

  redis_data:

  localstack_data: